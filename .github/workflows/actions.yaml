name: "GH Actions"
on:
  push:
    branches:
      - "release/**"
      - "sandbox/**"
      - "gh-actions"
  release:
    types: [published, created, edited]

jobs:
  test:
    name: "Run Unit Tests"
    strategy:
      matrix:
        os: ["windows-latest", "ubuntu-latest", "macOS-latest"]
        go: ["1.25.x", "1.24.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: WillAbides/setup-go-faster@v1.14.0
        with:
          go-version: ${{ matrix.go }}
      - run: "go test ./pkg/..."

  reports:
    name: "Run various reports on code basis"
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: jdx/mise-action@v2
        with:
          cache: true
          experimental: true
          log_level: debug
      - run: "make reports"

  simple-run:
    name: "Sanity Check"
    runs-on: "ubuntu-latest"
    needs: [test, reports]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: jdx/mise-action@v2
        with:
          cache: true
          experimental: true
          log_level: debug
      - run: "make bin/cciu"
      - run: "./bin/cciu -version"
