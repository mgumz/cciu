name: "GH Actions"
on:
  push:
    branches:
      - "release/**"
      - "sandbox/**"
      - "gh-actions"
  release:
    types: [published, created, edited]

jobs:
  test:
    name: "Run Unit Tests"
    strategy:
      matrix:
        os: ["windows-latest", "ubuntu-latest", "macOS-latest"]
    runs-on: ${{ matrix.os }}
    env:
      MISE_ENV: build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true
          experimental: true
      - run: "go test ./pkg/..."

  reports:
    name: "Run various reports on code basis"
    runs-on: "ubuntu-latest"
    env:
      MISE_ENV: report
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true
          experimental: true
      - run: "make reports"

  simple-run:
    name: "Sanity Check"
    runs-on: "ubuntu-latest"
    needs: [test, reports]
    env:
      MISE_ENV: build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true
          experimental: true
      - run: "make bin/cciu"
      - run: "./bin/cciu -version"
